# ─────────────────────────────────────────────
#  클래시 마크 (ClashMC) 설정 - Paper 1.21.4
#  모든 거리 단위: 타일(원작 칸). 1타일 = 2블록
#  스탯: 클래시로얄 11레벨(토너먼트 표준) 위키 기준
# ─────────────────────────────────────────────

# 경기장 목록 - 동시에 여러 경기가 돌아가려면 경기장을 여러 개 등록
#   /clash arena paste <이름>      서 있는 자리에 clash_arena.schem 붙여넣고 등록 (FAWE/WorldEdit 필요)
#   /clash arena grid <개수> [간격]  +X 방향으로 여러 개 한 번에 생성
#   /clash arena add <이름>        이미 붙여넣은 경기장의 기준점(붙여넣을 때 서 있던 자리)에 서서 등록
arenas:
  main:
    world: clash1
    x: 0
    y: -60
    z: 0

# 메인 경기장(main) 기준 +X 방향으로 step 칸마다 경기장 자동 등록 (arena2 ~ arena<count>)
#   기본: 총 5개 → x 0 / 90 / 180 / 270 / 360
arena-grid:
  count: 5
  step: 90

# 플러그인 업데이트로 경기장 schem 이 바뀌면 서버 켜질 때 비어 있는 경기장을 자동으로 다시 붙여넣음 (FAWE/WorldEdit 필요)
#   직접 손본 경기장이 있으면 false 로 하고 /clash arena repaste 로 직접
arena-auto-repaste: true

# 로비 - /clash lobby paste (clash_lobby.schem 붙여넣기 + 로비 지정) 또는 /clash setlobby
lobby:
  enabled: true                # 경기 밖 플레이어: 로비 스폰 / 간편 메뉴 / 보호
  world: clash1
  x: -79
  y: -60
  z: 63
  yaw: 180

ranked:
  min-players: 2               # 최소 인원 (짝수)
  max-players: 10
  preferred-players: 4         # 이 인원이 모이고 min-wait 초가 지나면 바로 시작
  min-wait: 8
  max-wait: 30                 # 이 시간이 지나면 2명이라도 시작
  trophy-window: 200           # 매칭 트로피 범위 (대기할수록 넓어짐)
  window-grow-per-second: 15
  king-loss-multiplier: 1.3    # 패배 시 킹은 더 많이 잃음
  unit-loss-multiplier: 0.5    # 유닛 플레이어는 적게 (항복이면 0)

skins:
  enabled: true                # skins.yml / 모델 플러그인에 skin_* 모델 필요

# 서버 켜진 뒤 자동으로 /cm reload (진행 중인 경기가 있으면 건너뜀)
auto-reload:
  enabled: true
  delays: [5, 30]              # 서버 켜지고 몇 초 뒤에 할지 (여러 번 가능)

game:
  # 킹이 어드벤처 모드로 경기장 위를 날아다니며 지휘 (false 면 발코니 고정)
  king-fly: true
  king-fly-speed: 0.06
  deck-seconds: 25             # 경기 전 덱 확인 시간 (저장된 덱이 8장이면 바로 준비 완료)
  surrender-after: 60          # 전투 시작 후 몇 초부터 킹이 항복 가능
  match-seconds: 180           # 정규 시간 3분
  double-elixir-last: 60       # 마지막 60초 더블 엘릭서
  overtime-seconds: 120        # 연장 (서든데스, 더블 엘릭서)
  end-delay: 8                 # 결과 표시 후 정리까지 초
  start-elixir: 5
  max-elixir: 10
  elixir-seconds: 2.8          # 엘릭서 1 충전 시간 (더블이면 절반)
  team-chat-slowmode: 5        # 대기 중 플레이어 팀 채팅 슬로우모드 (초)
  sight-range: 5.5             # (안 씀) 적 인식 거리는 각 카드 사거리와 같음
  # 블록/초 = 원작속도/60 × 2 × speed-scale  (보통 = 2블록/초). 사거리·범위 등 거리 설정은 1타일 = 3블록
  speed-scale: 1.0
  # 플레이어 걷기 속도(walkSpeed) = 블록/초 × 이 값  (기본 걷기 0.2 ≈ 4.3블록/초)
  walk-speed-per-block: 0.0465
  # 공중 유닛 비행 속도(flySpeed) = 블록/초 × 이 값  (기본 비행 0.1 ≈ 10.9블록/초)
  fly-speed-per-block: 0.0092
  air-height: 7                # 공중 유닛 비행 높이 (바닥 위 블록, 모델 커져서 4 → 7)
  follower-leash: 6            # 군단 AI가 우두머리를 따라다니는 거리 (블록)
  # 가르기: 군단 카드를 중앙선 양옆 1칸(가운데 두 열)에 놓으면 반반 나뉘어 양쪽 라인으로 감
  split:
    enabled: true
    width: 2.2                 # 중앙선에서 이 거리(블록) 안에 놓으면 가르기
  # 겹침 방지: 유닛끼리(지상끼리 / 공중끼리) 서로 밀어내고, 지상 유닛은 타워·건물 안으로 못 들어감
  # 건물은 타워나 다른 건물과 겹치는 자리에 배치 불가
  collision:
    enabled: true
    strength: 0.5              # 한 틱에 겹친 거리의 몇 배를 밀어낼지 (0.05~1, 클수록 딱딱하게)
    max-push: 0.35             # 유닛끼리 한 틱에 밀리는 최대 거리 (블록)
    player-push: 0.5           # 플레이어 유닛이 밀릴 때 속도 배율 (0 이면 플레이어는 안 밀림)
  charge-reset-ticks: 6        # 프린스 돌진: 이 틱 이상 멈춰 있으면 돌진/누적 거리 초기화 (20틱 = 1초)
  # 탑뷰: 경기 중 킹이 F키로 전환. 경기장 가운데 상공에서 바로 아래를 봄 (자리 고정, 고개만 돌려 칸 조준)
  # 높이 40이면 멀리 있는 유닛이 48블록 밖 → spigot.yml 의 entity-tracking-range (monsters / misc / display) 를 96 이상으로
  top-view:
    enabled: true
    height: 40                 # 바닥 위 높이 (블록)
    fly-speed: 0.35            # 탑뷰에서 앞뒤로 움직이는 속도 (마크 기본 비행 0.1)
    scroll: 80                 # 탑뷰에서 경기장 앞뒤로 움직일 수 있는 거리 (블록, 0 이면 고정, 최소 80) - 킹 타워 뒤까지
  team-glow: true              # 소환한 유닛·건물 테두리를 팀 색으로 빛나게 (BetterModel)
  team-glow-strength: 0.45     # 테두리 세기 0~1 (낮을수록 어둡고 약하게)
  team-glow-near: 12           # 이 거리(블록)보다 멀면 테두리를 그만큼 더 연하게 (멀리서 진해 보이는 것 방지)

towers:
  princess: { hp: 3052, damage: 109, hit-speed: 0.8, range: 7.5 }
  king:     { hp: 4824, damage: 109, hit-speed: 1.0, range: 7.0 }
  # ModelEngine 타워 모델 (비우면 블록 타워). ModelEngine 없으면 자동으로 블록 타워
  princess-model: clash_princess_tower   # 팀색은 플러그인이 tc_ 본에 칠함
  king-model: clash_king
ui:
  king-bar-scale: 2.6          # 킹 타워 체력바 크기
  princess-bar-scale: 1.7
  # ClashMC_UI_pack 리소스팩 사용 (엘릭서 바/크라운/체력바 글리프 + 카드 아이콘). 팩 없이 쓰면 false
  resource-pack: true
  # 타워/유닛 머리 위 체력바 (텍스트 디스플레이)
  hp-bars: true
  # 유닛 체력바 옆에 숫자 표시
  unit-hp-numbers: true
  # 맞을 때 떠오르는 데미지 숫자
  damage-numbers: true
  # UI 팩을 모델엔진 팩과 따로 올려둔 경우: 직접 받을 수 있는 zip 주소 + sha1 (비우면 안 보냄)
  # 참가(/clash join, /clash test start) 때 서버 기본 팩 위에 추가로 적용됨
  pack-url: ""
  pack-sha1: ""
  # UI 팩 자동 배포 (pack-url 을 비워두면 사용): jar 안의 팩을 이 포트로 직접 올려주고 sha1 도 자동
  #   접속할 때 쓴 서버 주소로 받아감. 호스팅 업체가 포트를 막으면 열어주거나 address 에 외부 주소 지정
  pack-host:
    enabled: true
    port: 8165
    address: ""                # 비우면 플레이어가 접속한 주소 사용 (예: play.myserver.kr)
    # server.properties 에 합친 팩 주소·sha1·id 자동 등록 → 접속 로딩 화면에서 한 번만 적용, 같은 버전이면 다시 안 받음
    #   address(또는 server.properties 의 server-ip) 가 있어야 함. 팩이 바뀌면 다음 재시작부터 반영 (그 전엔 게임 안에서 새 팩 전송)
    server-properties: true
  # 리소스팩 병합: /cm reload (서버 켜질 때 자동 리로드 포함) 때마다 아래 팩들 + UI 팩을 하나로 합쳐서 배포
  #   경로는 서버 폴더 기준. zip 파일이나 폴더 둘 다 됨. 같은 파일은 UI 팩 우선, 같은 JSON(폰트·아틀라스 등)은 목록을 합침
  #   → server.properties 의 resource-pack 에 BetterModel 팩을 따로 걸어둘 필요 없음 (걸려 있으면 비우기)
  merge-pack:
    enabled: true
    sources:
      - plugins/BetterModel/build.zip
# 서버 목록 아이콘: plugins/ClashMC/server-icon.png (64x64) 를 보여줌. 바꾸려면 그 파일을 교체 후 재시작
server-icon:
  enabled: true
# 배경음악 (UI 리소스팩에 들어 있음, 원곡 아님 - 직접 만든 곡)
#   로비 / 전투 / 연장전은 반복, 경기 끝나면 승리·패배 음악. 플레이어는 /clash bgm 으로 끄고 켬
#   category: 소리 설정의 어느 음량 조절을 따를지 (RECORDS = 주크박스/소리 블록, MUSIC = 음악)
bgm:
  enabled: true
  volume: 0.6
  category: RECORDS
  lobby: true
  battle: true
  victory-defeat: true
  # 곡 길이 (초). 같은 분위기 곡(lobby, lobby2, lobby3 ...)은 한 곡 끝날 때마다 무작위로 바뀜. 0 이면 그 곡은 안 씀
  length:
    lobby: 76.8
    lobby2: 70.0
    lobby3: 72.0
    battle: 64.0
    battle2: 60.0
    battle3: 60.0
    overtime: 51.2
    overtime2: 48.0
    victory: 5.6
    defeat: 4.7
hitbox:
  # 플레이어 유닛: 바닐라 scale 속성으로 히트박스를 카드 높이에 맞춤 (1.8블록 = 1.0배)
  scale-players: true
  # 플레이어 유닛 1인칭 눈높이를 모델 머리 높이에 맞춤 (모델 있을 때 scale-players 대신 사용)
  player-eye-from-model: true
  # 그때 최대 배율 (너무 크면 좁은 곳에 끼일 수 있음)
  player-eye-max-scale: 4.0
  # AI 유닛: 모델엔진 모델이 붙으면 모델의 hitbox 본이 히트박스를 결정 (false 권장)
  scale-modeled-mobs: false
  # scale 적용 시 모델까지 커지는 모델엔진 버전이면 true (모델 배율을 역보정)
  model-follows-scale: false
  # 모델 사용 시 충돌용 블록을 배리어로 (true) / 석재 블록 타워 (false)
  barrier-collision: true

modelengine:
  # 모델 id 형식: 블루프린트 또는 블루프린트:변형 (무료판 12개 제한 때문에 궁수/머스킷병, 해골/비행선, 건물 3종, 타워 2종을 묶음)
  enabled: true                # 모델 플러그인이 있으면 카드별 model 적용
  # auto = BetterModel 있으면 BetterModel, 없으면 ModelEngine / bettermodel / modelengine
  backend: auto

